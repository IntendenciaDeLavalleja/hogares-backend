name: Backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.1
        env:
          MARIADB_ROOT_PASSWORD: native-regression-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar MariaDB Connector/C y herramientas de compilación
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libmariadb-dev pkg-config
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest
        env:
          MARIADB_TEST_URL: mariadb+mariadbconnector://root:native-regression-ci-only@127.0.0.1:3306
      # El aviso usa rangos de Connector/C 3.x sobre el paquete Python 1.x.
      # Docker exige los paquetes Debian corregidos; ver docs/COOLIFY.md.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-217
      - name: Construir imagen independiente
        run: |
          docker build -t hogares-backend:check .
          docker run --rm --entrypoint python hogares-backend:check -c "from sqlalchemy import create_engine; engine = create_engine('mariadb+mariadbconnector://example:example@127.0.0.1:3306/sociales_db'); assert engine.dialect.dbapi.__name__ == 'mariadb'; engine.dispose()"
